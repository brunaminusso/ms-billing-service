apiVersion: batch/v1
kind: Job
metadata:
  name: ms-billing-service-migrate
  namespace: tech-challenge
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: ms-billing-service:local
          command: ["composer", "migrate"]
          env:
            - name: DB_HOST
              value: billing-mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: billing_service
            - name: DB_USER
              value: billing_user
            - name: DB_PASSWORD
              value: billing_pass
